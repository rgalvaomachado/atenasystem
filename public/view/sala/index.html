<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>AtenaSystem - Cadastro de Sala</title>
	<link href="/public/css/bootstrap.min.css" rel="stylesheet">
	<link href="/public/css/font-awesome.min.css" rel="stylesheet">
	<link href="/public/css/datepicker3.css" rel="stylesheet">
	<link href="/public/css/styles.css" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css?family=Montserrat:300,300i,400,400i,500,500i,600,600i,700,700i" rel="stylesheet">
	<link rel="icon" href="/public/img/hubis-icon.png">
</head>
<body style="background-color:white">
	<div id="menu-container"></div>
	<div class="col-sm-9 col-sm-offset-3 col-lg-10 col-lg-offset-2 main" style="background-color:white; margin-top:100px">
		<center>
			<h1>Cadastro de Sala</h1>
			<h4 id="msg-sucesso" style="display:none; color: green;">Salvo !</h4>
			<form id="formCriarSala">	
				<div class="row" style="max-width: 500px;">
					<div class="form-group text-left">
						<label>Nome</label>
						<input id="nome" name="nome" class="form-control" required autofocus>
					</div>
					<button type="submit" class="btn btn-md btn-warning">Cadastrar</button>
				</div>
			</form>	
		</center>
	</div>
	<script src="/public/js/bootstrap.min.js"></script>
	<script src="/public/js/menu.js"></script>
	<script src="/public/view/sala/index.js"></script>
</body>
</html>
