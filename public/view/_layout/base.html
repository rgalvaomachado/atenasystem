<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-page-title>AtenaSystem</title>
    
    <!-- CSS Variables & Design System -->
    <link rel="stylesheet" href="/public/view/_layout/styles.css">
    
    <!-- Bootstrap 5 (apenas grid/utilitários via CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <!-- Google Fonts: Inter (moderna, legível) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Favicon -->
    <link rel="icon" href="/public/img/hubis-icon.png">
    
    <!-- Page-specific CSS (injected via data-page-css) -->
    <link id="page-css" rel="stylesheet" href="">
</head>
<body>
    <!-- Top Navbar -->
    <nav class="atn-navbar" id="atn-navbar" role="navigation" aria-label="Navegação principal">
        <div class="container-fluid">
            <div class="atn-navbar-brand">
                <button class="atn-sidebar-toggle" id="sidebar-toggle" aria-label="Alternar menu lateral" aria-expanded="false" aria-controls="atn-sidebar">
                    <span class="atn-hamburger"></span>
                </button>
                <a href="/home" class="atn-logo" aria-label="AtenaSystem - Início">
                    <span class="atn-logo-icon"><i class="fas fa-graduation-cap"></i></span>
                    <span class="atn-logo-text"><span class="atn-logo-accent">Atena</span>System</span>
                </a>
            </div>
            <div class="atn-navbar-actions">
                <div class="atn-user-menu" id="user-menu">
                    <button class="atn-user-btn" id="user-btn" aria-expanded="false" aria-haspopup="true" aria-label="Menu do usuário">
                        <span class="atn-user-avatar" id="user-avatar">U</span>
                        <span class="atn-user-name" id="user-name">Usuário</span>
                        <i class="fas fa-chevron-down atn-user-chevron"></i>
                    </button>
                    <div class="atn-dropdown" id="user-dropdown" role="menu">
                        <div class="atn-dropdown-header">
                            <span id="dropdown-user-name"></span>
                            <small id="dropdown-user-role"></small>
                        </div>
                        <div class="atn-dropdown-divider"></div>
                        <button class="atn-dropdown-item" id="btn-logout" role="menuitem">
                            <i class="fas fa-sign-out-alt"></i> Sair
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Sidebar Overlay (mobile) -->
    <div class="atn-sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>

    <!-- Main Layout Container -->
    <div class="atn-layout">
        <!-- Sidebar -->
        <aside class="atn-sidebar" id="atn-sidebar" role="navigation" aria-label="Menu lateral">
            <div class="atn-sidebar-header">
                <span class="atn-sidebar-title">Menu</span>
                <button class="atn-sidebar-close" id="sidebar-close" aria-label="Fechar menu lateral">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <nav class="atn-sidebar-nav" id="atn-sidebar-nav" aria-label="Navegação do sistema">
                <!-- Menu items injected here by menu.js -->
            </nav>
            <div class="atn-sidebar-footer">
                <small class="atn-version">v1.0.0</small>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="atn-main" id="atn-main" role="main">
            <!-- Page content injected here -->
            <div id="page-content"></div>
        </main>
    </div>

    <!-- Toast Container -->
    <div class="atn-toast-container" id="atn-toast-container" aria-live="polite" aria-atomic="true"></div>

    <!-- Modal Container -->
    <div class="atn-modal-container" id="atn-modal-container"></div>

    <!-- Bootstrap 5 JS (apenas para collapse/dropdown/modal) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>

    <!-- Shared Modules (ES6) -->
    <script type="module" src="/public/view/_shared/menu.js"></script>
    <script type="module" src="/public/view/_shared/components.js"></script>

    <!-- Page-specific JS (injected via data-page-js) -->
    <script id="page-script" type="module"></script>

    <!-- Include Loader -->
    <script>
        (function() {
            'use strict';
            
            // Configuração da página atual (definida em cada HTML)
            const pageConfig = window.ATENA_PAGE_CONFIG || {};
            
            // Carrega CSS da página
            if (pageConfig.css) {
                document.getElementById('page-css').href = pageConfig.css;
            } else {
                document.getElementById('page-css').remove();
            }
            
            // Atualiza título
            if (pageConfig.title) {
                document.title = `AtenaSystem - ${pageConfig.title}`;
                document.querySelector('[data-page-title]').textContent = `AtenaSystem - ${pageConfig.title}`;
            }
            
            // Carrega HTML do conteúdo da página
            async function loadPageContent() {
                if (!pageConfig.content) return;
                
                try {
                    const response = await fetch(pageConfig.content);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const html = await response.text();
                    document.getElementById('page-content').innerHTML = html;
                    
                    // Dispara evento para scripts da página
                    document.dispatchEvent(new CustomEvent('atn:content-loaded', { detail: pageConfig }));
                } catch (error) {
                    console.error('Erro ao carregar conteúdo:', error);
                    document.getElementById('page-content').innerHTML = `
                        <div class="atn-alert atn-alert-danger">
                            <i class="fas fa-exclamation-triangle"></i>
                            <div>
                                <strong>Erro ao carregar a página</strong>
                                <p>${error.message}</p>
                            </div>
                        </div>
                    `;
                }
            }
            
            // Carrega script da página
            async function loadPageScript() {
                if (!pageConfig.js) return;
                
                try {
                    const script = document.getElementById('page-script');
                    script.src = pageConfig.js;
                } catch (error) {
                    console.error('Erro ao carregar script:', error);
                }
            }
            
            // Inicializa
            document.addEventListener('DOMContentLoaded', () => {
                loadPageContent();
                loadPageScript();
            });
        })();
    </script>
</body>
</html>
