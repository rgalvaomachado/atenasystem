<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>AtenaSystem - Editar Representante</title>
	<link href="/public/css/bootstrap.min.css" rel="stylesheet">
	<link href="/public/css/font-awesome.min.css" rel="stylesheet">
	<link href="/public/css/datepicker3.css" rel="stylesheet">
	<link href="/public/css/styles.css" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css?family=Montserrat:300,300i,400,400i,500,500i,600,600i,700,700i" rel="stylesheet">
	<link rel="icon" href="/public/img/hubis-icon.png">
</head>
<body style="background-color:white">
	<div id="menu-container"></div>
	<div class="col-sm-9 col-sm-offset-3 col-lg-10 col-lg-offset-2 main" style="background-color:white; margin-top:100px">
		<center>
			<h1>Editar Representante</h1>
			<h4 id="msg-sucesso" style="display:none; color: green;">Salvo !</h4>
			<h4 id="msg-delete" style="display:none; color: green;">Excluído !</h4>

			<div style="max-width: 500px;">
				<div class="form-group text-left">
					<label>Representantes</label>
					<select id="selectRepresentante" class="form-control">
						<option value="">Carregando representantes...</option>
					</select>
				</div>
				<button type="button" id="btnBuscarRepresentante" class="btn btn-md btn-warning">Buscar</button>
			</div>

			<div id="blocoEditar" style="display:none; max-width: 500px; margin-top: 30px;">
				<form id="formSalvarRepresentante" enctype="multipart/form-data" style="padding-bottom: 1%;">
					<input type="hidden" id="representanteId" name="id">
					<div class="form-group text-left">
						<label>Nome</label>
						<input id="representanteNome" name="nome" class="form-control" required>
					</div>
					<div class="form-group text-left">
						<label>Usuário</label>
						<input id="representanteUsuario" name="usuario" class="form-control" required>
					</div>
					<div class="form-group text-left">
						<label>Nova Senha (deixe em branco se não desejar alterar)</label>
						<input id="representanteSenha" name="senha" type="password" class="form-control">
					</div>
					<div class="form-group text-left">
						<label>Assinatura</label>
						<input id="representanteAssinatura" name="assinatura" type="file" class="form-control">
					</div>
					<div class="form-group text-left" id="blocoAssinaturaAtual" style="border: 1px solid #ccc; padding: 10px; display:none;">
						<label style="color:gray">Assinatura Atual</label>
						<br>
						<img id="imgAssinaturaAtual" style="max-width:150px" src="">
					</div>
					<button type="submit" class="btn btn-md btn-warning">Editar</button>
				</form>
				<form id="formExcluirRepresentante" style="margin-top: 10px;">
					<input type="hidden" id="excluirId" name="id">
					<button type="submit" class="btn btn-md btn-danger">Excluir</button>
				</form>
			</div>
		</center>
	</div>
	<script src="/public/js/bootstrap.min.js"></script>
	<script src="/public/js/menu.js"></script>
	<script src="/public/view/representante/index.js"></script>
</body>
</html>
