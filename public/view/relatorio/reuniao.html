<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>AtenaSystem - Relatório Reunião</title>
	<link href="/public/css/bootstrap.min.css" rel="stylesheet">
	<link href="/public/css/font-awesome.min.css" rel="stylesheet">
	<link href="/public/css/datepicker3.css" rel="stylesheet">
	<link href="/public/css/styles.css" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css?family=Montserrat:300,300i,400,400i,500,500i,600,600i,700,700i" rel="stylesheet">
	<link rel="icon" href="/public/img/hubis-icon.png">
</head>
<body style="background-color:white">
	<div id="menu-container"></div>
	<div class="col-sm-9 col-sm-offset-3 col-lg-10 col-lg-offset-2 main" style="background-color:white; margin-top:100px">
		<center>
			<h1>Relatório Reunião</h1>
			<div style="max-width: 500px;">
				<form id="formRelatorioReuniao">
					<div class="form-group text-left">
						<label>Data Inicial</label>
						<input name="data_inicial" id="inputDataInicialReuniao" class="form-control" type="date" required>
					</div>
					<div class="form-group text-left">
						<label>Data Final</label>
						<input name="data_final" id="inputDataFinalReuniao" class="form-control" type="date" required>
					</div>
					<button type="submit" class="btn btn-md btn-warning">Gerar Relatório</button>
				</form>
			</div>

			<div id="relatorioTableContainerReuniao" style="display:none; margin-top: 30px; width: 80%;">
				<table class="table table-bordered table-striped" style="text-align: center;" id="tableRelatorioReuniao">
					<thead>
						<tr>
							<th style="text-align: left;">Nome</th>
							<th style="text-align: center;">Presença</th>
							<th style="text-align: center;">Ausência</th>
							<th style="text-align: center;">Justificada</th>
						</tr>
					</thead>
					<tbody>
						<!-- Dados carregados via JS -->
					</tbody>
				</table>
			</div>
		</center>
	</div>
	<script src="/public/js/bootstrap.min.js"></script>
	<script src="/public/js/menu.js"></script>
	<script src="/public/view/relatorio/reuniao.js"></script>
</body>
</html>
