<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>AtenaSystem - Justificar Presença em Reunião</title>
	<link rel="stylesheet" href="/public/view/_layout/styles.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
	<script>
		window.ATENA_PAGE_CONFIG = {
			title: 'Justificar Presença em Reunião',
			css: '',
			content: '',
			js: '/public/view/tutore/index.js'
		};
	</script>

	<nav class="atn-navbar" id="atn-navbar" data-shared-navbar></nav>

	<div class="atn-layout" style="display:flex; min-height:calc(100vh - 4rem); margin-top:4rem;">
		<aside class="atn-sidebar" style="position:fixed; top:4rem; left:0; bottom:0; width:16rem; background:white; border-right:1px solid #e5e7eb; z-index:1020; padding:1rem 0; overflow-y:auto; font-family:'Inter',sans-serif;">
			<nav class="atn-sidebar-nav" id="atn-sidebar-nav"></nav>
		</aside>
		<main class="atn-main" style="margin-left:16rem; padding:2.5rem; flex:1; background:#f9fafb; min-height:calc(100vh - 4rem);">
			<div class="atn-card" style="max-width:600px; margin:0 auto; padding:2rem;">
				<h2 style="margin-bottom:0.25rem; color:#111827; font-weight:700;">Justificar Presença em Reunião</h2>
				<p style="color:#6b7280; margin-bottom:1.5rem; font-size:0.875rem;">Consulte e atualize o registro de presença do tutore.</p>
				<p style="margin:0 0 1.5rem; color:#6b7280; font-size:0.875rem;">Tutore: <strong id="nomeTutoreJustifica" style="color:#111827; font-weight:600;"></strong></p>

				<h4 id="msg-sucesso" style="display:none; color:#16a34a; font-weight:600; margin-bottom:1rem;">Presença justificada!</h4>
				<div style="margin-bottom:1.25rem;">
					<label for="dataJustificaReuniao" style="display:block; font-weight:500; color:#374151; font-size:0.875rem; margin-bottom:0.25rem;">Data</label>
					<input type="date" id="dataJustificaReuniao" class="atn-input" required>
				</div>
				<button type="button" id="btnBuscarPresencaReuniao" class="atn-btn atn-btn-primary">
					<i class="fas fa-magnifying-glass" aria-hidden="true"></i> Buscar presença
				</button>

				<div id="blocoResultadoReuniao" class="atn-card" style="display:none; margin-top:1.5rem; padding:1.5rem;">
					<div id="msgReuniaoNaoEncontrada" role="status" style="display:none; margin-bottom:1rem; color:#dc2626; font-weight:600;">Presença não encontrada.</div>
					<form id="formSalvarJustificativaReuniao" style="display:none; flex-direction:column; gap:1.25rem;">
						<div>
							<label for="statusPresenteReuniao" style="display:block; font-weight:500; color:#374151; font-size:0.875rem; margin-bottom:0.25rem;">Status</label>
							<select id="statusPresenteReuniao" class="atn-input">
								<option value="J">Falta Justificada</option>
								<option value="N">Falta</option>
								<option value="S">Presença</option>
							</select>
						</div>
						<button type="submit" class="atn-btn atn-btn-primary">Salvar justificativa</button>
					</form>
				</div>
			</div>
		</main>
	</div>

	<script type="module" src="/public/view/_shared/menu.js"></script>
	<script type="module" src="/public/view/_shared/components.js"></script>
	<script type="module" src="/public/view/tutore/index.js"></script>
</body>
</html>
