<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>AtenaSystem - Presença Alune</title>
	<link href="/public/css/bootstrap.min.css" rel="stylesheet">
	<link href="/public/css/font-awesome.min.css" rel="stylesheet">
	<link href="/public/css/datepicker3.css" rel="stylesheet">
	<link href="/public/css/styles.css" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css?family=Montserrat:300,300i,400,400i,500,500i,600,600i,700,700i" rel="stylesheet">
	<link rel="icon" href="/public/img/hubis-icon.png">
</head>
<body style="background-color:white">
	<div id="menu-container"></div>
	<div class="col-sm-9 col-sm-offset-3 col-lg-10 col-lg-offset-2 main" style="background-color:white; margin-top:100px">
		<center>
			<h1>Presença Aula Alune</h1>
			<h4 id="messageStatus"></h4>
			<div style="max-width: 600px;">
				<form id="formBuscarSala">
					<div class="form-group text-left">
						<label>Salas</label>
						<select name="sala" id="selectSala" class="form-control">
							<option value="">Carregando salas...</option>
						</select>
					</div>
					<button type="submit" class="btn btn-md btn-warning">Buscar</button>
				</form>

				<div id="formPresencaContainer" style="display:none; margin-top: 30px;">
					<form id="formCriarPresenca">
						<input type="hidden" name="sala" id="inputSalaId">	
						<div class="form-group text-left">
							<label>Data</label>
							<input name="data" id="inputData" class="form-control" type="date" required>
						</div>
						<div class="form-group text-left">
							<label>Aula</label>
							<select name="aula" id="selectAula" class="form-control">
								<option value="1">Primeira Aula</option>
								<option value="2">Segunda Aula</option>
							</select>
						</div>
						<div class="form-group text-left">
							<label>Alunes</label>
							<table class="table table-bordered table-striped" style="text-align:center" id="tableAlunes">
								<thead>
									<tr>
										<th style="text-align:left;">Nome</th>
										<th style="text-align:center; width: 120px;">Presente</th>
									</tr>
								</thead>
								<tbody>
									<!-- Alunos carregados via JS -->
								</tbody>
							</table>
						</div>
						<button type="submit" class="btn btn-md btn-warning">Salvar Presença</button>
					</form>
				</div>
			</div>
		</center>
	</div>
	<script src="/public/js/bootstrap.min.js"></script>
	<script src="/public/js/menu.js"></script>
	<script src="/public/view/presenca/cadastro_alune.js"></script>
</body>
</html>
