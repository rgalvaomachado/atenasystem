<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AtenaSystem - Início</title>
    <link rel="stylesheet" href="/public/view/_layout/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .hero-section {
            background: linear-gradient(135deg, #ffb53e 0%, #ffb53e 100%);
            color: white;
            border-radius: 1.5rem;
            padding: 4rem 3rem;
            min-height: calc(100vh - 9rem);
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(59, 130, 246, 0.25);
        }
        .hero-section::before {
            content: '';
            position: absolute;
            top: -50%; right: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 30px 30px;
        }
        .hero-title { font-size: 2.5rem; font-weight: 700; margin-bottom: 0.5rem; position: relative; z-index: 1; }
        .hero-subtitle { font-size: 1.125rem; opacity: 0.9; position: relative; z-index: 1; max-width: 600px; margin-left: auto; margin-right: auto; line-height: 1.6; }
    </style>
</head>
<body>
    <script>
        window.ATENA_PAGE_CONFIG = {
            title: 'Início',
            css: '',
            content: '',
            js: '/public/view/home/index.js'
        };
    </script>

    <nav class="atn-navbar" id="atn-navbar" data-shared-navbar></nav>

    <div class="atn-layout" style="display:flex; min-height:calc(100vh - 4rem);">
        <aside class="atn-sidebar" style="position:fixed; top:4rem; left:0; bottom:0; width:16rem; background:white; border-right:1px solid #e5e7eb; z-index:1020; padding:1rem 0; overflow-y:auto; font-family:Inter,sans-serif;">
            <nav class="atn-sidebar-nav" id="atn-sidebar-nav"></nav>
        </aside>
        <main class="atn-main" style="margin-left:16rem; padding:2.5rem; flex:1; background:#f9fafb; min-height:calc(100vh - 4rem);">
            <div class="hero-section">
                <div style="display:flex; align-items:center; justify-content:center; gap:2.5rem; flex-wrap:wrap; text-align:left; position:relative; z-index:1; width:100%;">
                    <div>
                        <h1 class="hero-title">Bem-vindo ao AtenaSystem</h1>
                        <p class="hero-subtitle">Gerencie monitorias, presenças e relatórios de forma simples e eficiente.</p>
                    </div>
                    <img src="/public/img/atena.jpeg" alt="Logo Atena" style="max-width:180px; border-radius:0.5rem; box-shadow:0 4px 15px rgba(255,181,62,0.3); flex-shrink:0;">
                </div>

            </div>
        </main>
    </div>

    <script type="module" src="/public/view/_shared/menu.js"></script>
    <script type="module" src="/public/view/_shared/components.js"></script>
    <script type="module" src="/public/view/home/index.js"></script>
    <script type="module">
        document.addEventListener('DOMContentLoaded', () => {
            if (window.atnMenu) window.atnMenu.init();
        });
    </script>
</body>
</html>
