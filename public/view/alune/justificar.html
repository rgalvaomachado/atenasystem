<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>AtenaSystem - Justificar Presença Alune</title>
	<link href="/public/css/bootstrap.min.css" rel="stylesheet">
	<link href="/public/css/font-awesome.min.css" rel="stylesheet">
	<link href="/public/css/datepicker3.css" rel="stylesheet">
	<link href="/public/css/styles.css" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css?family=Montserrat:300,300i,400,400i,500,500i,600,600i,700,700i" rel="stylesheet">
	<link rel="icon" href="/public/img/hubis-icon.png">
</head>
<body style="background-color:white">
	<div id="menu-container"></div>
	<div class="col-sm-9 col-sm-offset-3 col-lg-10 col-lg-offset-2 main" style="background-color:white; margin-top:100px">
		<center>
			<h1>Justificar Presença Alune</h1>
			<h4 id="msg-sucesso" style="display:none; color: green;">Salvo !</h4>

			<div style="max-width: 500px;">
				<div class="form-group text-left">
					<label>Salas</label>
					<select id="selectSalaJustifica" class="form-control">
						<option value="">Carregando salas...</option>
					</select>
				</div>

				<div id="blocoAluneFiltro" style="display:none;">
					<div class="form-group text-left">
						<label>Alunes</label>
						<select id="selectAluneJustifica" class="form-control">
							<option value="">Selecione um alune...</option>
						</select>
					</div>
					<div class="form-group text-left">
						<label>Data</label>
						<input type="date" id="dataJustifica" class="form-control" required>
					</div>
					<div class="form-group text-left">
						<label>Aula</label>
						<select id="aulaJustifica" class="form-control">
							<option value="1">Primeira Aula</option>
							<option value="2">Segunda Aula</option>
						</select>
					</div>
					<button type="button" id="btnBuscarPresenca" class="btn btn-md btn-warning">Buscar Presença</button>
				</div>

				<div id="blocoResultadoPresenca" style="display:none; margin-top: 30px;">
					<div id="msgNaoEncontrada" style="display:none; margin-bottom: 15px; color: red;">
						Presença não encontrada
					</div>
					<form id="formSalvarJustificativa" style="display:none;">
						<div class="form-group text-left">
							<label>Status de Presença</label>
							<select id="statusPresente" name="presente" class="form-control">
								<option value="J">Falta Justificada</option>
								<option value="N">Falta</option>
								<option value="S">Presença</option>
							</select>
						</div>
						<button type="submit" class="btn btn-md btn-warning">Justificar</button>
					</form>
				</div>
			</div>
		</center>
	</div>
	<script src="/public/js/bootstrap.min.js"></script>
	<script src="/public/js/menu.js"></script>
	<script src="/public/view/alune/index.js"></script>
</body>
</html>
