<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>AtenaSystem - Justificar Presença</title>
	<link rel="stylesheet" href="/public/view/_layout/styles.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
	<script>
		window.ATENA_PAGE_CONFIG = {
			title: 'Justificar Presença',
			css: '',
			content: '',
			js: '/public/view/alune/index.js'
		};
	</script>

	<nav class="atn-navbar" id="atn-navbar" data-shared-navbar></nav>

	<div class="atn-layout" style="display:flex; min-height:calc(100vh - 4rem); margin-top:4rem;">
		<aside class="atn-sidebar" style="position:fixed; top:4rem; left:0; bottom:0; width:16rem; background:white; border-right:1px solid #e5e7eb; z-index:1020; padding:1rem 0; overflow-y:auto; font-family:'Inter',sans-serif;">
			<nav class="atn-sidebar-nav" id="atn-sidebar-nav"></nav>
		</aside>
		<main class="atn-main" style="margin-left:16rem; padding:2.5rem; flex:1; background:#f9fafb; min-height:calc(100vh - 4rem);">
			<div style="max-width:600px; margin:0 auto;">
				<section class="atn-card" style="padding:2rem;">
					<h2 style="margin:0 0 0.25rem; color:#111827; font-weight:700;">Justificar Presença</h2>
					<p style="color:#6b7280; margin-bottom:1.5rem; font-size:0.875rem;">Consulte o registro e atualize o status de presença.</p>
					<h4 id="msg-sucesso" role="status" style="display:none; color:#16a34a; font-weight:600; margin-bottom:1rem;">Salvo!</h4>

					<div style="display:flex; flex-wrap:wrap; gap:0.5rem 1.5rem; margin-bottom:1.5rem;">
						<p style="margin:0; color:#6b7280; font-size:0.875rem;">Sala: <strong id="nomeSalaSelecionada" style="color:#111827; font-weight:600;"></strong></p>
						<p id="aluneSelecionadeContext" style="display:none; margin:0; color:#6b7280; font-size:0.875rem;">Alune: <strong id="nomeAluneSelecionade" style="color:#111827; font-weight:600;"></strong></p>
					</div>
					<div id="blocoAluneFiltro" style="display:none;">
						<div style="margin-bottom:1.25rem;">
							<label for="dataJustifica" style="display:block; font-weight:500; color:#374151; font-size:0.875rem; margin-bottom:0.25rem;">Data</label>
							<input type="date" id="dataJustifica" class="atn-input" required>
						</div>
						<div style="margin-bottom:1.25rem;">
							<label for="aulaJustifica" style="display:block; font-weight:500; color:#374151; font-size:0.875rem; margin-bottom:0.25rem;">Aula</label>
							<select id="aulaJustifica" class="atn-input">
								<option value="1">Primeira Aula</option>
								<option value="2">Segunda Aula</option>
							</select>
						</div>
						<button type="button" id="btnBuscarPresenca" class="atn-btn atn-btn-primary">
							<i class="fas fa-magnifying-glass" aria-hidden="true"></i> Buscar presença
						</button>
					</div>
				</section>

				<section id="blocoResultadoPresenca" class="atn-card" style="display:none; margin-top:1.5rem; padding:2rem;">
					<h3 style="margin:0 0 1rem; color:#111827; font-size:1.125rem; font-weight:600;">Resultado</h3>
					<div id="msgNaoEncontrada" role="status" style="display:none; margin-bottom:1rem; color:#dc2626; font-weight:600;">Presença não encontrada.</div>
					<form id="formSalvarJustificativa" style="display:none; flex-direction:column; gap:1.25rem;">
						<div>
							<label for="statusPresente" style="display:block; font-weight:500; color:#374151; font-size:0.875rem; margin-bottom:0.25rem;">Status de presença</label>
							<select id="statusPresente" name="presente" class="atn-input">
								<option value="J">Falta Justificada</option>
								<option value="N">Falta</option>
								<option value="S">Presença</option>
							</select>
						</div>
						<button type="submit" class="atn-btn atn-btn-primary">
							<i class="fas fa-check" aria-hidden="true"></i> Salvar justificativa
						</button>
					</form>
				</section>
			</div>
		</main>
	</div>

	<script type="module" src="/public/view/_shared/menu.js"></script>
	<script type="module" src="/public/view/_shared/components.js"></script>
	<script type="module" src="/public/view/alune/index.js"></script>
</body>
</html>
